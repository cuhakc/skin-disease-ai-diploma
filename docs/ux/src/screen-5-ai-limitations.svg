<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="DejaVu Sans, Arial, sans-serif"><rect width="390" height="844" fill="#F3F6F4"/>
<text x="24" y="34" font-size="13" font-weight="bold" fill="#14282B" text-anchor="start">9:41</text>
<rect x="318" y="24" width="32" height="12" rx="3" fill="none" stroke="#14282B" stroke-width="1.2"/>
<rect x="320" y="26" width="22" height="8" rx="2" fill="#14282B"/>
<text x="24" y="84" font-size="20" font-weight="bold" fill="#14282B" text-anchor="start">About the assessment</text>
<rect x="24" y="122" width="342" height="102" rx="14" fill="#FFFFFF" stroke="#C5D4D1" stroke-width="1"/>
<text x="40" y="148" font-size="14" font-weight="bold" fill="#0F5C63" text-anchor="start">What it does</text>
<text x="40" y="170" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">Compares your photo with a limited set of</text>
<text x="40" y="188" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">skin conditions and shows estimated</text>
<text x="40" y="206" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">probabilities.</text>
<rect x="24" y="236" width="342" height="120" rx="14" fill="#FFFFFF" stroke="#C5D4D1" stroke-width="1"/>
<text x="40" y="262" font-size="14" font-weight="bold" fill="#0F5C63" text-anchor="start">What it cannot do</text>
<text x="40" y="284" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">It cannot diagnose, rule out disease, or</text>
<text x="40" y="302" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">advise on treatment. Results depend on photo</text>
<text x="40" y="320" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">quality, lighting and the data it was trained on,</text>
<text x="40" y="338" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">which may not cover every skin tone.</text>
<rect x="24" y="368" width="342" height="84" rx="14" fill="#FFFFFF" stroke="#C5D4D1" stroke-width="1"/>
<text x="40" y="394" font-size="14" font-weight="bold" fill="#0F5C63" text-anchor="start">How to read the numbers</text>
<text x="40" y="416" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">A higher percentage means the photo looks more</text>
<text x="40" y="434" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">like that example, not that you have the condition.</text>
<rect x="24" y="464" width="342" height="84" rx="14" fill="#FFFFFF" stroke="#C5D4D1" stroke-width="1"/>
<text x="40" y="490" font-size="14" font-weight="bold" fill="#0F5C63" text-anchor="start">When to see a doctor</text>
<text x="40" y="512" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">Seek care for any spot that changes, bleeds, hurts</text>
<text x="40" y="530" font-size="12" font-weight="normal" fill="#14282B" text-anchor="start">or worries you, whatever the app shows.</text>
<rect x="24" y="564" width="342" height="40" rx="10" fill="#FFF1CC"/>
<rect x="24" y="564" width="5" height="40" rx="2" fill="#C98A00"/>
<text x="42" y="588" font-size="12.5" font-weight="bold" fill="#5E4200" text-anchor="start">Not a diagnosis. Not treatment advice.</text>
<text x="24" y="626" font-size="12.5" font-weight="bold" fill="#0F5C63" text-anchor="start">Privacy notice</text>
<line x1="24" y1="630" x2="104" y2="630" stroke="#0F5C63" stroke-width="1.2"/></svg>